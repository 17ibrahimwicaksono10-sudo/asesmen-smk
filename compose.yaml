name: asesmen-smk

services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

    networks:
      - default
      - dokploy-network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.employa.rule=Host(`employaskills.duckdns.org`)"
      - "traefik.http.routers.employa.entrypoints=websecure"
      - "traefik.http.routers.employa.tls=true"
      - "traefik.http.routers.employa.tls.certresolver=letsencrypt"
      - "traefik.http.routers.employa.service=employa-web"
      - "traefik.http.services.employa-web.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true