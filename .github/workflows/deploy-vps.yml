name: Deploy Asesmen to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asesmen-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and validate build
        run: |
          npm ci
          npm run build

      - name: Set up deploy SSH key and verified host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Backup persistent database and code snapshot on VPS
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@43.173.6.6 '
            set -e
            # Preflight check: Pastikan sudo -n diizinkan pada host VPS
            sudo -n true || { echo "CRITICAL ERROR: sudo -n tidak diizinkan pada VPS! Menghentikan deployment." >&2; exit 1; }

            TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
            SHORT_SHA="'"${COMMIT_SHA:0:7}"'"
            mkdir -p /home/ubuntu/asesmen-backups
            mkdir -p /home/ubuntu/asesmen-code-backups

            # 1. Backup persistent database with strict SHA-256 integrity verification (MANDATORY)
            if sudo -n test -f /home/ubuntu/Prototype/backend/data/database.json; then
              DB_BACKUP="/home/ubuntu/asesmen-backups/database-${TIMESTAMP}.json"
              sudo -n cp /home/ubuntu/Prototype/backend/data/database.json "${DB_BACKUP}"
              sudo -n chown ubuntu:ubuntu "${DB_BACKUP}"
              sudo -n chmod 600 "${DB_BACKUP}"
              sha256sum "${DB_BACKUP}" > "${DB_BACKUP}.sha256"
              chmod 600 "${DB_BACKUP}.sha256"
              # Verifikasi integritas: file wajib ada, ukuran > 0, dan checksum cocok
              if [ ! -s "${DB_BACKUP}" ] || ! sha256sum -c "${DB_BACKUP}.sha256"; then
                echo "CRITICAL ERROR: Backup database gagal diverifikasi atau korup! Menghentikan deployment." >&2
                exit 1
              fi
              echo "Database backup created and verified: ${DB_BACKUP}"
            fi

            # 2. Backup persistent multimodal evidence storage with strict integrity verification (MANDATORY if exists)
            if sudo -n test -d /home/ubuntu/Prototype/backend/data/evidence_storage; then
              EVIDENCE_BACKUP="/home/ubuntu/asesmen-backups/evidence_storage-${TIMESTAMP}.tar.gz"
              sudo -n tar -czf "${EVIDENCE_BACKUP}" -C /home/ubuntu/Prototype/backend/data evidence_storage
              sudo -n chown ubuntu:ubuntu "${EVIDENCE_BACKUP}"
              sudo -n chmod 600 "${EVIDENCE_BACKUP}"
              sha256sum "${EVIDENCE_BACKUP}" > "${EVIDENCE_BACKUP}.sha256"
              chmod 600 "${EVIDENCE_BACKUP}.sha256"
              # Verifikasi integritas: arsip gzip valid dan checksum cocok
              if [ ! -s "${EVIDENCE_BACKUP}" ] || ! tar -tzf "${EVIDENCE_BACKUP}" > /dev/null 2>&1 || ! sha256sum -c "${EVIDENCE_BACKUP}.sha256"; then
                echo "CRITICAL ERROR: Backup evidence storage gagal diverifikasi atau korup! Menghentikan deployment." >&2
                exit 1
              fi
              echo "Multimodal evidence storage backup created and verified: ${EVIDENCE_BACKUP}"
            fi

            # 3. Backup secret token key and backend env configuration securely (chmod 600, zero credential logging)
            if sudo -n test -f /home/ubuntu/Prototype/backend/data/.auth_secret; then
              AUTH_SECRET_BACKUP="/home/ubuntu/asesmen-backups/.auth_secret-${TIMESTAMP}"
              sudo -n cp /home/ubuntu/Prototype/backend/data/.auth_secret "${AUTH_SECRET_BACKUP}"
              sudo -n chown ubuntu:ubuntu "${AUTH_SECRET_BACKUP}"
              sudo -n chmod 600 "${AUTH_SECRET_BACKUP}"
              sha256sum "${AUTH_SECRET_BACKUP}" > "${AUTH_SECRET_BACKUP}.sha256"
              chmod 600 "${AUTH_SECRET_BACKUP}.sha256"
              if [ ! -s "${AUTH_SECRET_BACKUP}" ] || ! sha256sum -c "${AUTH_SECRET_BACKUP}.sha256"; then
                echo "CRITICAL ERROR: Backup auth secret gagal! Menghentikan deployment." >&2
                exit 1
              fi
              echo "Auth secret backup created and verified securely."
            fi
            if sudo -n test -f /home/ubuntu/Prototype/backend/.env; then
              ENV_BACKUP="/home/ubuntu/asesmen-backups/backend-env-${TIMESTAMP}"
              sudo -n cp /home/ubuntu/Prototype/backend/.env "${ENV_BACKUP}"
              sudo -n chown ubuntu:ubuntu "${ENV_BACKUP}"
              sudo -n chmod 600 "${ENV_BACKUP}"
              sha256sum "${ENV_BACKUP}" > "${ENV_BACKUP}.sha256"
              chmod 600 "${ENV_BACKUP}.sha256"
              if [ ! -s "${ENV_BACKUP}" ] || ! sha256sum -c "${ENV_BACKUP}.sha256"; then
                echo "CRITICAL ERROR: Backup backend env configuration gagal! Menghentikan deployment." >&2
                exit 1
              fi
              echo "Backend environment configuration backup created and verified securely."
            fi

            # 4. Snapshot current active code with timestamp and commit SHA
            SNAPSHOT_DIR="/home/ubuntu/asesmen-code-backups/release-${TIMESTAMP}-${SHORT_SHA}"
            if [ -f /home/ubuntu/Prototype/compose.yaml ]; then
              mkdir -p "${SNAPSHOT_DIR}"
              rsync -az \
                --exclude="/backend/data/***" \
                --exclude="**/evidence_storage/***" \
                --exclude="**/.auth_secret" \
                --exclude="**/.env*" \
                --exclude="**/node_modules/***" \
                --exclude="**/dist/***" \
                /home/ubuntu/Prototype/ "${SNAPSHOT_DIR}/"
              
              # Catat rilis snapshot aktual ke pointer file yang persisten
              echo "${SNAPSHOT_DIR}" > /home/ubuntu/asesmen-code-backups/LATEST_RELEASE_SNAPSHOT
              echo "Immutable code snapshot saved to ${SNAPSHOT_DIR}"
            fi

            # Clean all backups older than 14 days and code snapshots older than 30 days
            find /home/ubuntu/asesmen-backups -maxdepth 1 -type f \( -name "database-*" -o -name "evidence_storage-*" -o -name "backend-env-*" -o -name ".auth_secret-*" \) -mtime +14 -delete
            find /home/ubuntu/asesmen-code-backups -mindepth 1 -maxdepth 1 -type d -name "release-*" -mtime +30 -exec rm -rf {} +
          '

      - name: Sync code (NEVER sync secrets or assessment data)
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='/.git/' \
            --exclude='/backend/data/***' \
            --exclude='**/evidence_storage/***' \
            --exclude='**/.auth_secret' \
            --exclude='/backend/.env' \
            --exclude='/frontend/.env' \
            --exclude='/.env' \
            --exclude='**/.env*' \
            --exclude='**/node_modules/***' \
            --exclude='**/dist/***' \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            ./ ubuntu@43.173.6.6:/home/ubuntu/Prototype/

      - name: Rebuild and health-check VPS
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@43.173.6.6 \
            'set -e; sudo -n true; cd /home/ubuntu/Prototype; sudo -n docker compose config --quiet; sudo -n docker compose up -d --build; sudo -n docker compose ps; curl -fsS --retry 6 --retry-delay 3 --retry-connrefused http://127.0.0.1:8080/api/health'
