name: Deploy Asesmen to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asesmen-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and validate build
        run: |
          npm ci
          npm run build

      - name: Set up deploy SSH key and verified host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Backup persistent database and code snapshot on VPS
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@43.173.6.6 '
            set -e
            TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
            SHORT_SHA="'"${COMMIT_SHA:0:7}"'"
            mkdir -p /home/ubuntu/asesmen-backups
            mkdir -p /home/ubuntu/asesmen-code-backups

            # 1. Backup persistent database with SHA-256 checksum
            if [ -f /home/ubuntu/Prototype/backend/data/database.json ]; then
              DB_BACKUP="/home/ubuntu/asesmen-backups/database-${TIMESTAMP}.json"
              cp /home/ubuntu/Prototype/backend/data/database.json "${DB_BACKUP}"
              sha256sum "${DB_BACKUP}" > "${DB_BACKUP}.sha256"
              echo "Database backup created: ${DB_BACKUP}"
            fi
            if [ -f /home/ubuntu/Prototype/backend/data/.auth_secret ]; then
              cp /home/ubuntu/Prototype/backend/data/.auth_secret "/home/ubuntu/asesmen-backups/.auth_secret-${TIMESTAMP}"
            fi

            # 2. Snapshot current active code with timestamp and commit SHA
            SNAPSHOT_DIR="/home/ubuntu/asesmen-code-backups/release-${TIMESTAMP}-${SHORT_SHA}"
            if [ -f /home/ubuntu/Prototype/compose.yaml ]; then
              mkdir -p "${SNAPSHOT_DIR}"
              rsync -az \
                --exclude="/backend/data/***" \
                --exclude="**/evidence_storage/***" \
                --exclude="**/.auth_secret" \
                --exclude="**/.env*" \
                --exclude="**/node_modules/***" \
                --exclude="**/dist/***" \
                /home/ubuntu/Prototype/ "${SNAPSHOT_DIR}/"
              
              # Maintain pointer to previous release
              rm -rf /home/ubuntu/asesmen-code-backups/previous_release
              cp -al "${SNAPSHOT_DIR}" /home/ubuntu/asesmen-code-backups/previous_release
              echo "Immutable code snapshot saved to ${SNAPSHOT_DIR} and previous_release"
            fi

            # Clean database backups older than 14 days and code snapshots older than 30 days
            find /home/ubuntu/asesmen-backups -maxdepth 1 -type f -name "database-*.json*" -mtime +14 -delete
            find /home/ubuntu/asesmen-code-backups -mindepth 1 -maxdepth 1 -type d -name "release-*" -mtime +30 -exec rm -rf {} +
          '

      - name: Sync code (NEVER sync secrets or assessment data)
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='/.git/' \
            --exclude='/backend/data/***' \
            --exclude='**/evidence_storage/***' \
            --exclude='**/.auth_secret' \
            --exclude='/backend/.env' \
            --exclude='/frontend/.env' \
            --exclude='/.env' \
            --exclude='**/.env*' \
            --exclude='**/node_modules/***' \
            --exclude='**/dist/***' \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            ./ ubuntu@43.173.6.6:/home/ubuntu/Prototype/

      - name: Rebuild and health-check VPS
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@43.173.6.6 \
            'set -e; cd /home/ubuntu/Prototype; sudo -n docker compose config --quiet; sudo -n docker compose up -d --build; sudo -n docker compose ps; curl -fsS --retry 6 --retry-delay 3 --retry-connrefused http://127.0.0.1:8080/api/health'
